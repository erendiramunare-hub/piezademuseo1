<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; padding: 0; background-color: #f0f0f0; overflow: hidden; } 
    model-viewer { width: 100vw; height: 100vh; }
    #boton-forzado {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #7a3a30; 
      color: white; 
      padding: 15px 30px; 
      border-radius: 30px; 
      font-family: sans-serif; 
      font-weight: bold;
      font-size: 16px;
      border: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      cursor: pointer;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <model-viewer id="visor" camera-controls auto-rotate shadow-intensity="1" ar ar-modes="webxr scene-viewer quick-look"></model-viewer>
  
  <!-- Botón forzado que nunca se esconde -->
  <button id="boton-forzado" onclick="document.getElementById('visor').activateAR()">
    📱 Ver en mi espacio
  </button>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const urlDelModelo = urlParams.get('pieza');
    if(urlDelModelo) {
      document.getElementById('visor').src = urlDelModelo;
    }
  </script>
</body>
</html>
