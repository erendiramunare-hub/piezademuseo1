<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Realidad Aumentada</title>
  
  <!-- Importamos la librería -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <!-- Estilos para que el visor ocupe toda la pantalla de la nueva pestaña -->
  <style>
    body {
      margin: 0;
      background-color: #f0f0f0;
      overflow: hidden;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <!-- Visor principal con todos los permisos y preferencias para WebXR y Scene Viewer -->
  <model-viewer 
    src="https://raw.githubusercontent.com/erendiramunare-hub/model3d/main/encatrinados%203d.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    auto-rotate>
  </model-viewer>

</body>
</html>
